openapi: 3.1.0
info:
  title: Gateaux Job Runner API
  version: 2.0.0-draft
  description: |
    REST API for the Gateaux job runner 
    at https://gateaux.io. Skeleton matching the design at `API_REDESIGN.md`.

    Auth tiers:
      * User token  — issued via SSO (§13 of design). Used for org and
        report management, cross-report queries.
      * Service-account token — issued per report, scoped capabilities.
        Used by CI/baker.r-style scripts.

    Authorisation model (§1a):
      * Org membership controls visibility, shared secrets/env, billing.
      * Report create/modify/delete requires push access to the bound
        git repo (verified live at the host: GitHub today; GitLab to
        follow).

    All write endpoints accept Bearer JWTs in `Authorization`. The
    browser web UI may also rely on a `gx_session` cookie.

servers:
  - url: https://gateaux.io/api/v2

# ---------------------------------------------------------------------------
# Default auth: Bearer JWT. Override per-route where needed.
# ---------------------------------------------------------------------------
security:
  - bearerAuth: []
  - cookieAuth: []

tags:
  - { name: Auth,         description: SSO / device-code / identity linking / session management }
  - { name: Orgs,         description: Organisation CRUD }
  - { name: OrgMembers,   description: Organisation membership and roles }
  - { name: Integrations, description: Git-host integrations (GitHub App, etc.) }
  - { name: Git,          description: Helpers backed by linked git hosts (repo picker, etc.) }
  - { name: Reports,      description: Report CRUD (gated by repo push access) }
  - { name: Secrets,      description: Secret values at org and report level (write-only) }
  - { name: Env,          description: Non-secret env defaults at org and report level }
  - { name: Tokens,       description: Service-account token management }
  - { name: Jobs,         description: Job submit / list / read / cancel }
  - { name: Logs,         description: Job log retrieval }
  - { name: Outputs,      description: Job output file listing + download }
  - { name: Events,       description: SSE state streams }

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:

  # ------------------ Auth ------------------
  /auth/sso/login:
    get:
      tags: [Auth]
      summary: Begin browser SSO flow (redirects to Keycloak)
      security: []
      parameters:
        - in: query
          name: redirect
          schema: { type: string, format: uri }
      responses:
        '302': { description: Redirect to IdP }

  /auth/sso/callback:
    get:
      tags: [Auth]
      summary: OIDC callback target
      security: []
      parameters:
        - { in: query, name: code,  required: true, schema: { type: string } }
        - { in: query, name: state, required: true, schema: { type: string } }
      responses:
        '302':
          description: Redirect to original `redirect`; sets `gx_session` cookie

  /auth/session:
    get:
      tags: [Auth]
      summary: Current session info + a Bearer token usable from CLI
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }

  /auth/sessions:
    get:
      tags: [Auth]
      summary: List my active sessions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SessionSummary' }
    delete:
      tags: [Auth]
      summary: Revoke all my sessions (log out everywhere)
      responses: { '204': { description: Revoked } }

  /auth/sessions/{id}:
    delete:
      tags: [Auth]
      summary: Revoke a specific session
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses: { '204': { description: Revoked } }

  /auth/device:
    post:
      tags: [Auth]
      summary: Begin device-code flow (for CLI / R)
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceAuthorization' }

  /auth/device/token:
    post:
      tags: [Auth]
      summary: Poll for completion of a device-code login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_code]
              properties:
                device_code: { type: string }
      responses:
        '200':
          description: User has approved; bearer token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  bearer:     { type: string }
                  expires_at: { type: string, format: date-time }
        '400':
          description: Still pending, expired, or denied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ------------------ Identity linking ------------------
  /auth/link/{provider}:
    parameters:
      - { in: path, name: provider, required: true,
          schema: { type: string, enum: [github, google, gitlab] } }
    get:
      tags: [Auth]
      summary: Begin linking an additional IdP to my account
      responses: { '302': { description: Redirect to Keycloak link flow } }

  # ------------------ Orgs ------------------
  /orgs:
    get:
      tags: [Orgs]
      summary: List orgs I belong to
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: { $ref: '#/components/schemas/Org' }
    post:
      tags: [Orgs]
      summary: Create a new org (user token only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrgCreate' }
      responses:
        '201':
          description: Created
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Org' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /orgs/{org}:
    parameters:
      - { $ref: '#/components/parameters/OrgName' }
    get:
      tags: [Orgs]
      summary: Read one org
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Org' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Orgs]
      summary: Update an org (admin or owner)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrgUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Org' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Orgs]
      summary: Delete an org (owner; only if no active reports)
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Conflict — active reports remain }

  # ------------------ Org members ------------------
  /orgs/{org}/members:
    parameters:
      - { $ref: '#/components/parameters/OrgName' }
    get:
      tags: [OrgMembers]
      summary: List members of an org
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OrgMember' }
    post:
      tags: [OrgMembers]
      summary: Invite a user to the org
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role:  { $ref: '#/components/schemas/OrgRole' }
      responses:
        '201':
          description: Invitation sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrgMember' }

  /orgs/{org}/members/{user_sub}:
    parameters:
      - { $ref: '#/components/parameters/OrgName' }
      - { in: path, name: user_sub, required: true, schema: { type: string } }
    patch:
      tags: [OrgMembers]
      summary: Change a member's role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { $ref: '#/components/schemas/OrgRole' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrgMember' }
    delete:
      tags: [OrgMembers]
      summary: Remove a member
      responses: { '204': { description: Removed } }

  # ------------------ Org-level secrets and env ------------------
  /orgs/{org}/secrets:
    parameters:
      - { $ref: '#/components/parameters/OrgName' }
    get:
      tags: [Secrets]
      summary: List org-level secret key names
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { keys: { type: array, items: { type: string } } } }

  /orgs/{org}/secrets/{key}:
    parameters:
      - { $ref: '#/components/parameters/OrgName' }
      - { in: path, name: key, required: true, schema: { type: string } }
    put:
      tags: [Secrets]
      summary: Set / overwrite an org-level secret
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [value], properties: { value: { type: string } } }
      responses: { '204': { description: Stored } }
    delete:
      tags: [Secrets]
      summary: Delete an org-level secret
      responses: { '204': { description: Deleted } }

  /orgs/{org}/env:
    parameters:
      - { $ref: '#/components/parameters/OrgName' }
    get:
      tags: [Env]
      summary: Read org-level env defaults
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, additionalProperties: { type: string } }

  /orgs/{org}/env/{key}:
    parameters:
      - { $ref: '#/components/parameters/OrgName' }
      - { in: path, name: key, required: true, schema: { type: string } }
    put:
      tags: [Env]
      summary: Set an org-level env default
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [value], properties: { value: { type: string } } }
      responses: { '204': { description: Stored } }
    delete:
      tags: [Env]
      summary: Delete an org-level env default
      responses: { '204': { description: Deleted } }

  # ------------------ Git-host integrations ------------------
  /orgs/{org}/integrations/github:
    parameters:
      - { $ref: '#/components/parameters/OrgName' }
    get:
      tags: [Integrations]
      summary: Status of the org's Gateaux GitHub App install
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitHubIntegration' }
    delete:
      tags: [Integrations]
      summary: Uninstall the Gateaux GitHub App for this org
      responses: { '204': { description: Uninstalled } }

  /orgs/{org}/integrations/github/install:
    parameters:
      - { $ref: '#/components/parameters/OrgName' }
    post:
      tags: [Integrations]
      summary: Begin GitHub App install flow
      responses:
        '302': { description: Redirect to GitHub's app-install flow }

  # ------------------ Git repo picker ------------------
  /git/repos:
    get:
      tags: [Git]
      summary: List repos I can push to (across all linked git hosts)
      parameters:
        - in: query
          name: provider
          schema: { type: string, enum: [github, gitlab] }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GitRepo' }

  # ------------------ Reports ------------------
  /orgs/{org}/reports:
    parameters:
      - { $ref: '#/components/parameters/OrgName' }
    get:
      tags: [Reports]
      summary: List reports I can access in this org
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: { $ref: '#/components/schemas/Report' }
    post:
      tags: [Reports]
      summary: Create a new report (user token only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportCreate' }
      responses:
        '201':
          description: Created
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /orgs/{org}/reports/{report}:
    parameters:
      - { $ref: '#/components/parameters/OrgName' }
      - { $ref: '#/components/parameters/ReportName' }
    get:
      tags: [Reports]
      summary: Read one report
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Reports]
      summary: Update a report (user token only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Reports]
      summary: Archive a report and its job history (user token only)
      responses:
        '204': { description: Archived }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ------------------ Secrets ------------------
  /orgs/{org}/reports/{report}/secrets:
    parameters:
      - { $ref: '#/components/parameters/OrgName' }
      - { $ref: '#/components/parameters/ReportName' }
    get:
      tags: [Secrets]
      summary: List secret key names (values are never echoed)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items: { type: string }

  /orgs/{org}/reports/{report}/secrets/{key}:
    parameters:
      - { $ref: '#/components/parameters/OrgName' }
      - { $ref: '#/components/parameters/ReportName' }
      - { in: path, name: key, required: true, schema: { type: string } }
    put:
      tags: [Secrets]
      summary: Set / overwrite a secret value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: { type: string }
      responses:
        '204': { description: Stored }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Secrets]
      summary: Delete a secret
      responses:
        '204': { description: Deleted }

  # ------------------ Env defaults ------------------
  /orgs/{org}/reports/{report}/env:
    parameters:
      - { $ref: '#/components/parameters/OrgName' }
      - { $ref: '#/components/parameters/ReportName' }
    get:
      tags: [Env]
      summary: Read env-var defaults for a report
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { type: string }

  /orgs/{org}/reports/{report}/env/{key}:
    parameters:
      - { $ref: '#/components/parameters/OrgName' }
      - { $ref: '#/components/parameters/ReportName' }
      - { in: path, name: key, required: true, schema: { type: string } }
    put:
      tags: [Env]
      summary: Set an env-var default
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: { type: string }
      responses: { '204': { description: Stored } }
    delete:
      tags: [Env]
      summary: Delete an env-var default
      responses: { '204': { description: Deleted } }

  # ------------------ Tokens ------------------
  /orgs/{org}/reports/{report}/tokens:
    parameters:
      - { $ref: '#/components/parameters/OrgName' }
      - { $ref: '#/components/parameters/ReportName' }
    get:
      tags: [Tokens]
      summary: List service-account tokens for this report
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TokenMeta' }
    post:
      tags: [Tokens]
      summary: Issue a new service-account token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenCreate' }
      responses:
        '201':
          description: Created — `token` shown once
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenIssued' }

  /orgs/{org}/reports/{report}/tokens/{id}:
    parameters:
      - { $ref: '#/components/parameters/OrgName' }
      - { $ref: '#/components/parameters/ReportName' }
      - { in: path, name: id, required: true, schema: { type: string } }
    delete:
      tags: [Tokens]
      summary: Revoke a service-account token
      responses: { '204': { description: Revoked } }

  # ------------------ Jobs ------------------
  /jobs:
    get:
      tags: [Jobs]
      summary: Cross-report job search (user token only)
      parameters:
        - { in: query, name: report,         schema: { type: string }, description: glob }
        - { in: query, name: status,         schema: { type: string }, description: comma-list }
        - { in: query, name: tag,            schema: { type: string } }
        - { in: query, name: created_after,  schema: { type: string, format: date-time } }
        - { in: query, name: created_before, schema: { type: string, format: date-time } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: { $ref: '#/components/schemas/Job' }

  /orgs/{org}/reports/{report}/jobs:
    parameters:
      - { $ref: '#/components/parameters/OrgName' }
      - { $ref: '#/components/parameters/ReportName' }
    get:
      tags: [Jobs]
      summary: List jobs for a report (server-side filter + paginate)
      parameters:
        - { in: query, name: status,         schema: { type: string }, description: comma-list }
        - { in: query, name: tag,            schema: { type: string } }
        - { in: query, name: created_after,  schema: { type: string, format: date-time } }
        - { in: query, name: created_before, schema: { type: string, format: date-time } }
        - { in: query, name: 'env.*',        schema: { type: string }, description: filter on a given env key (glob) }
        - { in: query, name: 'git.commit_sha', schema: { type: string }, description: prefix match supported }
        - { in: query, name: 'actor.user',   schema: { type: string, format: email } }
        - { in: query, name: sort,           schema: { type: string, example: '-id' } }
        - { in: query, name: fields,         schema: { type: string }, description: comma-list of fields to include }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
      responses:
        '200':
          description: OK
          headers:
            X-Total-Count: { schema: { type: integer } }
            Link:          { schema: { type: string  } }
            ETag:          { schema: { type: string  } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: { $ref: '#/components/schemas/Job' }
        '304': { description: 'Not Modified (If-None-Match)' }
    post:
      tags: [Jobs]
      summary: Submit a new job
      parameters:
        - in: header
          name: Idempotency-Key
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobSubmit' }
      responses:
        '201':
          description: Created
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /orgs/{org}/reports/{report}/jobs/{job_id}:
    parameters:
      - { $ref: '#/components/parameters/OrgName' }
      - { $ref: '#/components/parameters/ReportName' }
      - { $ref: '#/components/parameters/JobId' }
    get:
      tags: [Jobs]
      summary: Read one job
      parameters:
        - in: query
          name: wait
          schema: { type: integer, minimum: 0, maximum: 60 }
          description: long-poll, block up to N seconds for a status change
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Jobs]
      summary: Cancel a running or pending job (idempotent)
      responses:
        '202':
          description: Cancellation initiated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '200':
          description: Already in a terminal state — current state returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }

  # ------------------ Logs ------------------
  /orgs/{org}/reports/{report}/jobs/{job_id}/log:
    parameters:
      - { $ref: '#/components/parameters/OrgName' }
      - { $ref: '#/components/parameters/ReportName' }
      - { $ref: '#/components/parameters/JobId' }
    get:
      tags: [Logs]
      summary: Fetch job log (plain text or SSE tail)
      parameters:
        - in: query
          name: since
          schema: { type: string, format: date-time }
          description: only return log lines on/after this timestamp
        - in: query
          name: stream
          schema: { type: boolean, default: false }
          description: if true, server upgrades to text/event-stream
        - in: header
          name: Accept
          schema:
            type: string
            enum: [text/plain, text/event-stream]
      responses:
        '200':
          description: OK
          content:
            text/plain:        { schema: { type: string } }
            text/event-stream: { schema: { type: string } }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------ Outputs ------------------
  /orgs/{org}/reports/{report}/jobs/{job_id}/outputs:
    parameters:
      - { $ref: '#/components/parameters/OrgName' }
      - { $ref: '#/components/parameters/ReportName' }
      - { $ref: '#/components/parameters/JobId' }
    get:
      tags: [Outputs]
      summary: List output files for a job
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items: { $ref: '#/components/schemas/OutputFile' }

  /orgs/{org}/reports/{report}/jobs/{job_id}/outputs/{filename}:
    parameters:
      - { $ref: '#/components/parameters/OrgName' }
      - { $ref: '#/components/parameters/ReportName' }
      - { $ref: '#/components/parameters/JobId' }
      - { in: path, name: filename, required: true, schema: { type: string } }
    get:
      tags: [Outputs]
      summary: Download a single output file (Range supported)
      responses:
        '200':
          description: OK (full body)
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '206':
          description: Partial Content (Range request)
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------ Events ------------------
  /orgs/{org}/reports/{report}/jobs/{job_id}/events:
    parameters:
      - { $ref: '#/components/parameters/OrgName' }
      - { $ref: '#/components/parameters/ReportName' }
      - { $ref: '#/components/parameters/JobId' }
    get:
      tags: [Events]
      summary: SSE stream of job state transitions
      parameters:
        - in: header
          name: Accept
          required: true
          schema:
            type: string
            enum: [text/event-stream]
      responses:
        '200':
          description: Open stream
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  event: state
                  data: {"id":151045,"status":"running","started_at":"..."}

# ---------------------------------------------------------------------------
# Components
# ---------------------------------------------------------------------------
components:
  securitySchemes:
    bearerAuth:
      type:        http
      scheme:      bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in:   cookie
      name: gx_session

  parameters:
    OrgName:
      in:       path
      name:     org
      required: true
      schema:   { type: string }
    ReportName:
      in:       path
      name:     report
      required: true
      schema:   { type: string }
    JobId:
      in:       path
      name:     job_id
      required: true
      schema:   { type: integer, format: int64 }
    Page:
      in:    query
      name:  page
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      in:    query
      name:  per_page
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated but lacking the required scope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnprocessableEntity:
      description: Valid JSON but semantically invalid (unknown predictor_tag, etc.)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:

    # --- Generic error envelope ---
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:    { type: string, example: INVALID_ENV_SHAPE }
            message: { type: string }
            details: { type: object, additionalProperties: true }
            trace_id:{ type: string }

    # --- Auth ---
    Session:
      type: object
      properties:
        user:
          type: object
          properties:
            email: { type: string, format: email }
            name:  { type: string }
        expires_at: { type: string, format: date-time }
        bearer:     { type: string, description: paste into GATEAUX_TOKEN env }

    SessionSummary:
      type: object
      properties:
        id:           { type: string }
        created_at:   { type: string, format: date-time }
        user_agent:   { type: string }
        last_seen_at: { type: string, format: date-time }

    DeviceAuthorization:
      type: object
      properties:
        device_code:      { type: string }
        user_code:        { type: string, example: WDJB-MJHT }
        verification_url: { type: string, format: uri }
        interval:         { type: integer, example: 5 }
        expires_in:       { type: integer, example: 600 }

    # --- Org ---
    OrgRole:
      type: string
      enum: [owner, admin, member, viewer]

    OrgCreate:
      type: object
      required: [name]
      properties:
        name:           { type: string, pattern: '^[a-z0-9-]+$' }
        title:          { type: string }
        billing_email:  { type: string, format: email }

    OrgUpdate:
      type: object
      properties:
        title:          { type: string }
        billing_email:  { type: string, format: email }
        default_visibility:
          type: string
          enum: [private, org, public]

    Org:
      allOf:
        - { $ref: '#/components/schemas/OrgCreate' }
        - type: object
          properties:
            created_at:         { type: string, format: date-time }
            default_visibility: { type: string }
            my_role:            { $ref: '#/components/schemas/OrgRole' }
            is_personal:        { type: boolean }

    OrgMember:
      type: object
      properties:
        user_sub:   { type: string }
        email:      { type: string, format: email }
        name:       { type: string }
        role:       { $ref: '#/components/schemas/OrgRole' }
        invited_at: { type: string, format: date-time, nullable: true }
        joined_at:  { type: string, format: date-time, nullable: true }

    # --- Git binding ---
    GitProvider:
      type: string
      enum: [github, gitlab, bitbucket]

    GitBinding:
      type: object
      required: [provider, repo_id, branch]
      properties:
        provider:     { $ref: '#/components/schemas/GitProvider' }
        repo_id:      { type: string, description: stable host id }
        owner:        { type: string, description: display only }
        repo:         { type: string, description: display only }
        branch:       { type: string }
        subdirectory: { type: string }
        clone_url:    { type: string, format: uri, readOnly: true }

    GitRepo:
      type: object
      properties:
        provider:        { $ref: '#/components/schemas/GitProvider' }
        repo_id:         { type: string }
        owner:           { type: string }
        repo:            { type: string }
        default_branch:  { type: string }
        permissions:
          type: object
          properties:
            push:  { type: boolean }
            admin: { type: boolean }

    GitHubIntegration:
      type: object
      properties:
        installed:        { type: boolean }
        installation_id:  { type: integer, nullable: true }
        installed_at:     { type: string, format: date-time, nullable: true }
        repos:
          type: array
          items:
            type: object
            properties:
              owner: { type: string }
              repo:  { type: string }

    # --- Report ---
    SubmitPolicy:
      type: string
      enum: [git_write_only, org_members, public]

    Visibility:
      type: string
      enum: [private, org, public]

    ReportCreate:
      type: object
      required: [name, git, docker]
      properties:
        name:          { type: string, pattern: '^[A-Za-z0-9_-]+$' }
        title:         { type: string }
        git:           { $ref: '#/components/schemas/GitBinding' }
        docker:        { type: string }
        resources:     { $ref: '#/components/schemas/Resources' }
        submit_policy: { $ref: '#/components/schemas/SubmitPolicy' }
        visibility:    { $ref: '#/components/schemas/Visibility' }
        wants:         { type: array, items: { type: string } }

    ReportUpdate:
      type: object
      properties:
        title:         { type: string }
        git:           { $ref: '#/components/schemas/GitBinding' }
        docker:        { type: string }
        resources:     { $ref: '#/components/schemas/Resources' }
        submit_policy: { $ref: '#/components/schemas/SubmitPolicy' }
        visibility:    { $ref: '#/components/schemas/Visibility' }
        wants:         { type: array, items: { type: string } }

    Report:
      allOf:
        - { $ref: '#/components/schemas/ReportCreate' }
        - type: object
          properties:
            org:        { type: string }
            created_at: { type: string, format: date-time }
            created_by: { type: string, format: email }

    # --- Tokens ---
    TokenScope:
      type: string
      enum:
        - jobs:submit
        - jobs:read
        - jobs:cancel
        - logs:read
        - outputs:read
        - secrets:read

    TokenCreate:
      type: object
      required: [name, scopes]
      properties:
        name:   { type: string }
        scopes:
          type: array
          items: { $ref: '#/components/schemas/TokenScope' }

    TokenMeta:
      type: object
      properties:
        id:           { type: string }
        name:         { type: string }
        scopes:
          type: array
          items: { $ref: '#/components/schemas/TokenScope' }
        created_at:   { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }

    TokenIssued:
      allOf:
        - { $ref: '#/components/schemas/TokenMeta' }
        - type: object
          properties:
            token:
              type: string
              description: Shown ONCE; never returned again.

    # --- Job submission and read ---
    Resources:
      type: object
      properties:
        cpus:   { type: integer, minimum: 1 }
        memory: { type: integer, description: GB }
        gpus:   { type: integer, nullable: true }

    DepRef:
      type: object
      properties:
        report: { type: string }
        job_id: { type: integer, nullable: true }

    JobSubmit:
      type: object
      properties:
        tag: { type: string, description: human-friendly label }
        env:
          type: object
          additionalProperties: { type: string }
        resources: { $ref: '#/components/schemas/Resources' }
        deps:
          type: object
          properties:
            wants:
              type: array
              items: { $ref: '#/components/schemas/DepRef' }
            requires:
              type: array
              items: { $ref: '#/components/schemas/DepRef' }
        webhook:
          type: string
          format: uri
          description: server POSTs state transitions here

    JobStatus:
      type: string
      description: |
        Matches the server's `JobStatus` (Gorbachev/ApiTypes.hs:368-370).
        `cancel_init` covers the brief window between the user's DELETE
        request and the cancel signal reaching the runner.
        `invalid` is set when the queued job fails validation before any
        runner picks it up.
      enum: [pending, running, success, cancel_init, cancelling, cancelled, failed, invalid]

    Actor:
      type: object
      properties:
        type:        { type: string, enum: [user, service_account] }
        user:        { type: string, format: email, nullable: true }
        token_id:    { type: string, nullable: true }
        token_name:  { type: string, nullable: true }

    GitJobRef:
      allOf:
        - { $ref: '#/components/schemas/GitRef' }
        - type: object
          properties:
            commit_sha: { type: string }
            submodules:
              type: array
              items:
                type: object
                properties:
                  path:   { type: string }
                  commit: { type: string }

    ImageRef:
      type: object
      properties:
        ref:    { type: string, example: 'ubuntu/psc-estimation:latest' }
        digest: { type: string, example: 'sha256:f14730…' }

    OutputFile:
      type: object
      properties:
        name:     { type: string }
        size:     { type: integer }
        mime:     { type: string }
        checksum: { type: string, example: 'sha256:…' }
        url:      { type: string, format: uri }

    Job:
      type: object
      required: [id, report, status, created_at]
      properties:
        id:           { type: integer, format: int64 }
        report:       { type: string }
        tag:          { type: string, nullable: true }
        status:       { $ref: '#/components/schemas/JobStatus' }
        message:      { type: string, nullable: true }
        created_at:   { type: string, format: date-time }
        started_at:   { type: string, format: date-time, nullable: true }
        finished_at:  { type: string, format: date-time, nullable: true }
        actor:        { $ref: '#/components/schemas/Actor' }
        git:          { $ref: '#/components/schemas/GitJobRef' }
        image:        { $ref: '#/components/schemas/ImageRef' }
        env:
          type: object
          additionalProperties: { type: string }
        env_resolved:
          type: object
          additionalProperties: { type: string }
          description: env after merging report-level defaults
        resources:    { $ref: '#/components/schemas/Resources' }
        deps:
          type: object
          properties:
            wants:
              type: array
              items: { $ref: '#/components/schemas/DepRef' }
            requires:
              type: array
              items: { $ref: '#/components/schemas/DepRef' }
        runner:
          type: string
          nullable: true
          description: identifier of the worker that ran the job
        links:
          type: object
          properties:
            self:    { type: string, format: uri }
            log:     { type: string, format: uri }
            outputs: { type: string, format: uri }
            events:  { type: string, format: uri }
